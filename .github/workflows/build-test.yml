name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      steam_publish_target:
        description: "Steam target app(s) to upload"
        type: choice
        required: true
        default: both
        options:
          - both
          - main
          - demo
      steam_live_branch:
        description: "Steam branch to set live"
        type: choice
        required: true
        default: public
        options:
          - public
          - beta
          - continue
      steam_promote_live:
        description: "Promote uploaded build live after upload"
        type: boolean
        required: true
        default: true

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './client/package-lock.json'

      - name: Install Server Dependencies
        run: |
          cd server
          npm install

      - name: Build Server
        run: |
          cd server
          npm run build

      - name: Install Client Dependencies
        run: |
          cd client
          npm install

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install macOS Rust targets for Steam bridge
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux Electron deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbfile1 \
            libsecret-1-0 \
            libgtk-3-0 \
            libxss1 \
            libasound2t64 \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libdrm2 \
            libgbm1

      - name: Install Playwright Browsers
        if: matrix.os != 'windows-latest'
        run: |
          cd client
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            npx playwright install chromium
          else
            npx playwright install
          fi

      - name: Build Client
        run: |
          cd client
          npm run build

      - name: Disable Steam for CI Smoke
        run: echo "DISABLE_STEAM=1" >> $GITHUB_ENV

      - name: Package Electron App (Unpacked)
        shell: bash
        run: |
          mkdir -p client/server/dist
          cp -r server/dist/* client/server/dist/
          cp server/package.json client/server/
          cd client/server && npm install --omit=dev && cd ../..
          cd client
          npm run build:native-steam-bridge
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            npx electron-builder --mac --x64 --dir
            if [ -d "dist_electron/mac-x64" ]; then
              mv dist_electron/mac-x64 dist_electron/mac
            fi
          elif [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            npx electron-builder --win --dir
          else
            npx electron-builder --linux --dir
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fix Linux Permissions
        if: matrix.os == 'ubuntu-latest'
        run: |
          find client/dist_electron/linux-unpacked -maxdepth 1 -type f -executable -exec chmod +x {} + || true
          ls -R client/dist_electron/linux-unpacked

      - name: Stage Windows Steam Depot
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cd client
          STEAM_PLATFORM_FILTER=windows node scripts/stage-steam-releases.mjs

      - name: Verify Windows Steam Depot
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cd client
          STEAM_PLATFORM_FILTER=windows node scripts/verify-steam-layout.mjs
          STEAM_PLATFORM_FILTER=windows node scripts/verify-release-binaries.mjs
          echo "Windows staged depot file count: $(find releases/steam/microsoft-windows -type f | wc -l)" >> "$GITHUB_STEP_SUMMARY"

      - name: Export Windows Depot Layout Screenshot
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Set-Location client
          ./scripts/export-windows-depot-layout.ps1

      - name: Run Packaged Smoke Test (Windows staged depot)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cd client
          SMOKE_TEST_FORCE_STEAM_BYPASS=1 REQUIRE_STAGED_BINARY=1 npm run smoke:packaged

      - name: Run Packaged Smoke Test
        if: matrix.os != 'windows-latest'
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' && matrix.os == 'macos-latest' }}
        shell: bash
        run: |
          cd client
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            xvfb-run -a --server-args="-screen 0 1920x1080x24" npm run smoke:packaged
          else
            npm run smoke:packaged
          fi

      - name: Upload Packaged Smoke Screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaged-smoke-${{ matrix.os }}
          path: |
            client/tests/output/platforms/windows/packaged-smoke.png
            client/tests/output/platforms/windows/packaged-smoke.txt
            client/tests/output/platforms/windows/backend-smoke.txt
            client/tests/output/platforms/linux/packaged-smoke.png
            client/tests/output/platforms/linux/packaged-smoke.txt
            client/tests/output/platforms/linux/backend-smoke.txt
            client/tests/output/platforms/macos/packaged-smoke.png
            client/tests/output/platforms/macos/packaged-smoke.txt
          if-no-files-found: ignore

      - name: Upload Windows Depot Layout Artifact
        uses: actions/upload-artifact@v4
        if: always() && matrix.os == 'windows-latest'
        with:
          name: windows-depot-layout-${{ matrix.os }}
          path: |
            client/tests/output/platforms/windows/depot-layout.png
            client/tests/output/platforms/windows/depot-layout.txt
          if-no-files-found: ignore

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            client/dist_electron/win-unpacked
            client/dist_electron/mac
            client/dist_electron/linux-unpacked
          if-no-files-found: warn

      - name: Run Smoke Test
        continue-on-error: true
        shell: bash
        run: |
          cd client
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            xvfb-run -a npm run test:smoke || npm run test:smoke
          else
            npm run test:smoke
          fi

      - name: Upload Screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-screenshot-${{ matrix.os }}
          path: client/tests/output/launch-screenshot.png
          if-no-files-found: ignore

  deploy-steam:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    env:
      STEAM_PUBLISH_TARGET: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.steam_publish_target || 'both' }}
      STEAM_LIVE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.steam_live_branch || 'public' }}
      STEAM_PROMOTE_LIVE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.steam_promote_live || 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Client Dependencies
        run: |
          cd client
          npm install

      - name: Download Windows Build
        uses: actions/download-artifact@v4
        with:
          name: build-windows-latest
          path: client/dist_electron/win-unpacked

      - name: Download macOS Build
        uses: actions/download-artifact@v4
        with:
          name: build-macos-latest
          path: client/dist_electron/mac

      - name: Download Linux Build
        uses: actions/download-artifact@v4
        with:
          name: build-ubuntu-latest
          path: client/dist_electron/linux-unpacked

      - name: Fix Downloaded Permissions
        run: |
          find client/dist_electron/linux-unpacked -maxdepth 1 -type f | xargs -I {} chmod +x {} || true

      - name: Normalize Depot Layout
        shell: bash
        run: |
          # Artifacts can extract as <path>/<folder>/<folder>; flatten them so depot roots are correct.
          flatten_if_nested() {
            local dir="$1"
            local nested="$dir/$(basename "$dir")"
            if [ -d "$nested" ]; then
              echo "Flattening nested artifact folder: $nested -> $dir"
              shopt -s dotglob nullglob
              mv "$nested"/* "$dir"/
              shopt -u dotglob nullglob
              rmdir "$nested"
            fi
          }

          flatten_if_nested client/dist_electron/win-unpacked
          flatten_if_nested client/dist_electron/mac
          flatten_if_nested client/dist_electron/linux-unpacked

          # The downloaded Linux artifact can lose its executable bit during the
          # archive round-trip. Fix it after flattening so the real launch target
          # is executable before depot staging/verification.
          find client/dist_electron/linux-unpacked -maxdepth 1 -type f | xargs -I {} chmod +x {} || true

          test -f client/dist_electron/win-unpacked/ConquerorsDominationDemo.exe
          test -d client/dist_electron/mac/ConquerorsDominationDemo.app
          test -f client/dist_electron/mac/ConquerorsDominationDemo.app/Contents/MacOS/ConquerorsDominationDemo
          test -f client/dist_electron/linux-unpacked/conquerors-domination-demo

          echo "Verified expected launch targets:"
          echo "- Windows launch: client/dist_electron/win-unpacked/ConquerorsDominationDemo.exe"
          echo "- macOS launch:   client/dist_electron/mac/ConquerorsDominationDemo.app"
          echo "- Linux launch:   client/dist_electron/linux-unpacked/conquerors-domination-demo"

      - name: Stage Steam depot folders
        run: |
          cd client
          node scripts/stage-steam-releases.mjs

      - name: Verify staged Steam depot folders
        env:
          VERIFY_RELEASE_COMPARE_SOURCES: 0
        run: |
          cd client
          node scripts/verify-steam-layout.mjs
          node scripts/verify-release-binaries.mjs
          node scripts/verify-steam-runtime.mjs

      - name: Summarize staged depot file counts
        run: |
          echo "Steam staged depot file counts" >> "$GITHUB_STEP_SUMMARY"
          echo "- Windows: $(find client/releases/steam/microsoft-windows -type f | wc -l)" >> "$GITHUB_STEP_SUMMARY"
          echo "- macOS: $(find client/releases/steam/macos -type f | wc -l)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Linux: $(find client/releases/steam/linux -type f | wc -l)" >> "$GITHUB_STEP_SUMMARY"

      - name: Select Steam auth mode
        id: steam-auth
        shell: bash
        env:
          STEAM_SHARED_SECRET: ${{ secrets.STEAM_SHARED_SECRET }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
        run: |
          if [ -n "$STEAM_SHARED_SECRET" ]; then
            echo "mode=totp" >> "$GITHUB_OUTPUT"
            echo "Using TOTP auth via STEAM_SHARED_SECRET."
          elif [ -n "$STEAM_CONFIG_VDF" ]; then
            echo "mode=config" >> "$GITHUB_OUTPUT"
            echo "Using config.vdf auth via STEAM_CONFIG_VDF."
          else
            echo "::error::Missing Steam auth secret. Add STEAM_SHARED_SECRET (recommended) or STEAM_CONFIG_VDF."
            exit 1
          fi

      - name: Generate Steam TOTP
        id: steam-totp
        if: steps.steam-auth.outputs.mode == 'totp'
        uses: CyberAndrii/steam-totp@v1
        with:
          shared_secret: ${{ secrets.STEAM_SHARED_SECRET }}

      - name: Steam Deploy (TOTP)
        if: steps.steam-auth.outputs.mode == 'totp' && (env.STEAM_PUBLISH_TARGET == 'both' || env.STEAM_PUBLISH_TARGET == 'demo')
        uses: game-ci/steam-deploy@v3
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          password: ${{ secrets.STEAM_PASSWORD }}
          totp: ${{ steps.steam-totp.outputs.code }}
          appId: 4432220
          firstDepotIdOverride: 4432222
          buildDescription: "v${{ github.run_number }}"
          # Keep upload and live-promotion as separate steps. The combined
          # upload+setlive path is what causes the demo commit to fail.
          releaseBranch: ''
          rootPath: client
          depot1Path: releases/steam/macos
          depot2Path: releases/steam/microsoft-windows
          depot3Path: releases/steam/linux

      - name: Promote Demo Build Live (TOTP)
        if: steps.steam-auth.outputs.mode == 'totp' && env.STEAM_PROMOTE_LIVE == 'true' && (env.STEAM_PUBLISH_TARGET == 'both' || env.STEAM_PUBLISH_TARGET == 'demo')
        shell: bash
        env:
          STEAM_PARTNER_KEY: ${{ secrets.STEAM_PARTNER_KEY }}
          STEAM_APPROVER_STEAMID: ${{ secrets.STEAM_APPROVER_STEAMID }}
          STEAM_BRANCH: ${{ env.STEAM_LIVE_BRANCH }}
        run: |
          if [ -z "$STEAM_PARTNER_KEY" ]; then
            echo "STEAM_PARTNER_KEY not set; skipping demo live promotion."
            exit 0
          fi
          build_id="$(grep -o 'BuildID [0-9]\+' client/steampipe/output/app_build_4432220.log | tail -n1 | awk '{print $2}')"
          test -n "$build_id"
          cd client
          node scripts/steam-set-live.mjs demo "$build_id" "$STEAM_BRANCH"

      - name: Reset Steam deploy workspace for main (TOTP)
        if: steps.steam-auth.outputs.mode == 'totp' && (env.STEAM_PUBLISH_TARGET == 'both' || env.STEAM_PUBLISH_TARGET == 'main')
        shell: bash
        run: |
          sudo rm -rf BuildOutput client/BuildOutput

      - name: Steam Deploy Main (TOTP)
        if: steps.steam-auth.outputs.mode == 'totp' && (env.STEAM_PUBLISH_TARGET == 'both' || env.STEAM_PUBLISH_TARGET == 'main')
        uses: game-ci/steam-deploy@v3
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          password: ${{ secrets.STEAM_PASSWORD }}
          totp: ${{ steps.steam-totp.outputs.code }}
          appId: 4432210
          firstDepotIdOverride: 4432211
          buildDescription: "v${{ github.run_number }}"
          releaseBranch: ''
          rootPath: client
          depot1Path: releases/steam/microsoft-windows
          depot2Path: releases/steam/macos
          depot3Path: releases/steam/linux

      - name: Promote Main Build Live (TOTP)
        if: steps.steam-auth.outputs.mode == 'totp' && env.STEAM_PROMOTE_LIVE == 'true' && (env.STEAM_PUBLISH_TARGET == 'both' || env.STEAM_PUBLISH_TARGET == 'main')
        shell: bash
        env:
          STEAM_PARTNER_KEY: ${{ secrets.STEAM_PARTNER_KEY }}
          STEAM_APPROVER_STEAMID: ${{ secrets.STEAM_APPROVER_STEAMID }}
          STEAM_BRANCH: ${{ env.STEAM_LIVE_BRANCH }}
        run: |
          if [ -z "$STEAM_PARTNER_KEY" ]; then
            echo "STEAM_PARTNER_KEY not set; skipping main live promotion."
            exit 0
          fi
          build_id="$(grep -o 'BuildID [0-9]\+' client/steampipe/output/app_build_4432210.log | tail -n1 | awk '{print $2}')"
          test -n "$build_id"
          cd client
          node scripts/steam-set-live.mjs main "$build_id" "$STEAM_BRANCH"

      - name: Steam Deploy (config.vdf)
        if: steps.steam-auth.outputs.mode == 'config' && (env.STEAM_PUBLISH_TARGET == 'both' || env.STEAM_PUBLISH_TARGET == 'demo')
        uses: game-ci/steam-deploy@v3
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          appId: 4432220
          firstDepotIdOverride: 4432222
          buildDescription: "v${{ github.run_number }}"
          # In config.vdf mode, fallback to upload-time setlive when explicit
          # partner-key promotion is unavailable.
          releaseBranch: ${{ (env.STEAM_PROMOTE_LIVE == 'true' && env.STEAM_LIVE_BRANCH != 'continue') && env.STEAM_LIVE_BRANCH || '' }}
          rootPath: client
          depot1Path: releases/steam/macos
          depot2Path: releases/steam/microsoft-windows
          depot3Path: releases/steam/linux

      - name: Promote Demo Build Live (config.vdf)
        if: steps.steam-auth.outputs.mode == 'config' && env.STEAM_PROMOTE_LIVE == 'true' && (env.STEAM_PUBLISH_TARGET == 'both' || env.STEAM_PUBLISH_TARGET == 'demo')
        shell: bash
        env:
          STEAM_PARTNER_KEY: ${{ secrets.STEAM_PARTNER_KEY }}
          STEAM_APPROVER_STEAMID: ${{ secrets.STEAM_APPROVER_STEAMID }}
          STEAM_BRANCH: ${{ env.STEAM_LIVE_BRANCH }}
        run: |
          if [ -z "$STEAM_PARTNER_KEY" ]; then
            echo "STEAM_PARTNER_KEY not set; skipping demo live promotion."
            exit 0
          fi
          build_id="$(grep -o 'BuildID [0-9]\+' client/steampipe/output/app_build_4432220.log | tail -n1 | awk '{print $2}')"
          test -n "$build_id"
          cd client
          node scripts/steam-set-live.mjs demo "$build_id" "$STEAM_BRANCH"

      - name: Reset Steam deploy workspace for main (config.vdf)
        if: steps.steam-auth.outputs.mode == 'config' && (env.STEAM_PUBLISH_TARGET == 'both' || env.STEAM_PUBLISH_TARGET == 'main')
        shell: bash
        run: |
          sudo rm -rf BuildOutput client/BuildOutput

      - name: Steam Deploy Main (config.vdf)
        if: steps.steam-auth.outputs.mode == 'config' && (env.STEAM_PUBLISH_TARGET == 'both' || env.STEAM_PUBLISH_TARGET == 'main')
        uses: game-ci/steam-deploy@v3
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          appId: 4432210
          firstDepotIdOverride: 4432211
          buildDescription: "v${{ github.run_number }}"
          releaseBranch: ${{ (env.STEAM_PROMOTE_LIVE == 'true' && env.STEAM_LIVE_BRANCH != 'continue') && env.STEAM_LIVE_BRANCH || '' }}
          rootPath: client
          depot1Path: releases/steam/microsoft-windows
          depot2Path: releases/steam/macos
          depot3Path: releases/steam/linux

      - name: Promote Main Build Live (config.vdf)
        if: steps.steam-auth.outputs.mode == 'config' && env.STEAM_PROMOTE_LIVE == 'true' && (env.STEAM_PUBLISH_TARGET == 'both' || env.STEAM_PUBLISH_TARGET == 'main')
        shell: bash
        env:
          STEAM_PARTNER_KEY: ${{ secrets.STEAM_PARTNER_KEY }}
          STEAM_APPROVER_STEAMID: ${{ secrets.STEAM_APPROVER_STEAMID }}
          STEAM_BRANCH: ${{ env.STEAM_LIVE_BRANCH }}
        run: |
          if [ -z "$STEAM_PARTNER_KEY" ]; then
            echo "STEAM_PARTNER_KEY not set; skipping main live promotion."
            exit 0
          fi
          build_id="$(grep -o 'BuildID [0-9]\+' client/steampipe/output/app_build_4432210.log | tail -n1 | awk '{print $2}')"
          test -n "$build_id"
          cd client
          node scripts/steam-set-live.mjs main "$build_id" "$STEAM_BRANCH"

      - name: Steam deploy hint (on failure)
        if: failure()
        run: |
          echo "Steam deploy failed." >> "$GITHUB_STEP_SUMMARY"
          echo "- If using TOTP: confirm STEAM_SHARED_SECRET and STEAM_PASSWORD are current." >> "$GITHUB_STEP_SUMMARY"
          echo "- If using config.vdf: refresh via steamcmd login, base64 encode config.vdf, update STEAM_CONFIG_VDF." >> "$GITHUB_STEP_SUMMARY"
          echo "- Ensure this account has Steamworks build permissions for app 4432220." >> "$GITHUB_STEP_SUMMARY"
